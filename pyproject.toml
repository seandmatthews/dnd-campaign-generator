[project]
name = "campaign-studio"
version = "0.1.1"
description = "One localhost app over three D&D engines — maps, world building, agent simulation, one review queue. A campaign is a directory of files."
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "pyyaml>=6.0.3",
    "httpx>=0.28",
]

# No [build-system] on purpose: the studio is an application tree, not an
# installable package (uv treats this as a deps-only "virtual" project and
# never installs campaign-studio itself). Two boot paths:
#   uv run python studio/run.py          — uv creates .venv + installs the
#                                          lock (uv.lock) automatically
#   pip install -r studio/requirements.txt
#                                        — the plain-Python path; doctor
#                                          --fix and start.bat use this
# studio/requirements.txt stays the source of truth for the pinned versions
# the maintainer tests against; keep the two in sync.

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff.lint]
# The CI lint gate is the runtime-crash class (its step name says so):
# pyflakes F — undefined/unused/redefined names, the class that caught a
# leaked Path.home monkeypatch in test_llm — plus E9 for syntax-level
# runtime errors. Selected EXPLICITLY so a ruff upgrade can never widen
# or drift the gate's contract (CI pins the ruff version; this pins the
# rules). Style rules are deliberately not part of the gate; a finding
# here is a real defect or dead code, fixed rather than suppressed.
select = ["E9", "F"]
