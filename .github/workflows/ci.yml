name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-tier:
    # The fast test tier: engine suites with mocked subprocesses, the
    # verification ladder, the FMG importer (synthetic fixtures), the studio
    # API suite, and the JS escape harness. The integration tier needs the
    # ignored tools/ tree (FMG + settlemaker builds) and stays local.
    #
    # Matrix: this is a Windows-first py3.10 app (junction handling, MAX_PATH
    # logic, WinError-32 log rotation are all Windows paths), so at least one
    # Windows leg must run — an ubuntu-only CI proved nothing about the
    # platform the code actually ships on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies (pinned)
        # studio/requirements.txt is the source of truth for the pinned
        # versions the maintainer tests against (see pyproject.toml) — a
        # floating install could go red on upstream drift or green on a
        # combination never tested locally. pytest matches the uv.lock
        # dev group (keep in sync when the lock moves).
        run: |
          python -m pip install --upgrade pip
          pip install -r studio/requirements.txt pytest==9.1.1

      - name: Install browser-E2E dependencies (ticket 36)
        # The first-DM Playwright suite boots its own studio + stub LLM
        # provider against a throwaway CAMPAIGN_DATA_ROOT; it needs the
        # pinned @playwright/test tree and the chromium browser. The FMG
        # tools are git-ignored, so on CI the suite runs the no-FMG leg
        # (steps 1-3 + fixture-backed 6-13) — the full-FMG leg runs
        # locally where the tools exist.
        run: |
          cd studio/tests/e2e
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Lint (runtime-crash class: syntax errors, undefined names)
        run: |
          pip install ruff
          ruff check agentic-simulator/src agentic-simulator/tests studio dnd-mapping/src run-tests.py

      - name: Fast tier
        run: python run-tests.py
